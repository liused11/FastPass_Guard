<ion-tabs>

  <ion-tab-bar slot="bottom" color="light">

    <!-- ═══ GATE STATION tabs ═══ -->
    <ng-container *ngIf="auth.isGateStation">
      <ion-tab-button tab="tab1" href="/tabs/tab1">
        <ion-icon aria-hidden="true" name="git-branch-outline"></ion-icon>
        <ion-label>Gate Control</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="tab2" href="/tabs/tab2">
        <ion-icon aria-hidden="true" name="scan-outline"></ion-icon>
        <ion-label>Scan</ion-label>
      </ion-tab-button>
    </ng-container>

    <!-- ═══ DOOR ACCESS tabs ═══ -->
    <ng-container *ngIf="auth.isDoorStation">
      <ion-tab-button tab="guard-qr" href="/tabs/guard-qr">
        <ion-icon aria-hidden="true" name="qr-code-outline"></ion-icon>
        <ion-label>My QR Pass</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="door-access" href="/tabs/door-access">
        <ion-icon aria-hidden="true" name="business-outline"></ion-icon>
        <ion-label>Door Access</ion-label>
      </ion-tab-button>
    </ng-container>

    <!-- ═══ SHARED: Stats & Profile ═══ -->
    <ion-tab-button *ngIf="auth.isSuperGuard" tab="dashboard" href="/tabs/dashboard">
      <ion-icon aria-hidden="true" name="stats-chart-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
