<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title class="font-bold tracking-wide text-white">Gate Control</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding bg-slate-50">
  <div class="h-full">
    <!-- Gate Status -->
    <div class="mb-6 p-6 rounded-2xl text-center shadow-sm border transition-all duration-300"
         [ngClass]="{
           'bg-red-50 border-red-200 text-red-800': gateStatus === 'Closed',
           'bg-green-50 border-green-200 text-green-800': gateStatus === 'Open',
           'bg-yellow-50 border-yellow-200 text-yellow-800': gateStatus === 'Moving'
         }">
      <h2 class="text-lg font-semibold mb-1 opacity-80">Gate Status</h2>
      <div class="text-4xl font-extrabold tracking-widest uppercase">{{ gateStatus }}</div>
    </div>

    <!-- Controls -->
    <div class="grid grid-cols-2 gap-4 mb-8 mt-6">
      <ion-button color="success" expand="block" shape="round" class="h-16 text-lg font-bold shadow" (click)="openGate()" [disabled]="gateStatus === 'Open' || gateStatus === 'Moving'">
        <ion-icon name="arrow-up-circle-outline" slot="start"></ion-icon>
        OPEN
      </ion-button>
      <ion-button color="danger" expand="block" shape="round" class="h-16 text-lg font-bold shadow" (click)="closeGate()" [disabled]="gateStatus === 'Closed' || gateStatus === 'Moving'">
        <ion-icon name="arrow-down-circle-outline" slot="start"></ion-icon>
        CLOSE
      </ion-button>
    </div>

    <!-- Emergency -->
    <div class="mt-8 mb-8">
      <ion-button color="warning" expand="block" shape="round" class="h-16 font-extrabold text-xl shadow border-2 border-yellow-400" (click)="emergencyOpen()">
        <ion-icon name="warning" slot="start"></ion-icon>
        EMERGENCY OPEN
      </ion-button>
    </div>

    <!-- Override -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mt-4">
      <h3 class="text-sm font-bold mb-4 text-gray-500 uppercase tracking-wide">Vehicle Type Override</h3>
      <ion-segment [(ngModel)]="vehicleType" color="primary" mode="ios" class="bg-slate-100">
        <ion-segment-button value="car" class="py-2">
          <ion-icon name="car-sport-outline"></ion-icon>
          <ion-label>Car</ion-label>
        </ion-segment-button>
        <ion-segment-button value="motorcycle" class="py-2">
          <ion-icon name="bicycle-outline"></ion-icon>
          <ion-label>Moto</ion-label>
        </ion-segment-button>
        <ion-segment-button value="ev" class="py-2">
          <ion-icon name="flash-outline"></ion-icon>
          <ion-label>EV</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>
  </div>
</ion-content>
