<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title class="font-bold tracking-wide text-white">Guard Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding bg-slate-50">
  <div class="relative flex flex-col items-center mt-10">
    <div class="w-28 h-28 bg-blue-100 rounded-full flex items-center justify-center border-4 border-white shadow-lg z-10">
      <ion-icon name="shield-checkmark-outline" class="text-5xl text-blue-600"></ion-icon>
    </div>
    
    <div class="bg-white w-full rounded-2xl shadow-sm pt-16 pb-6 px-6 -mt-14 text-center border border-gray-100">
      <h2 class="text-2xl font-bold text-gray-800">Officer John</h2>
      <p class="text-blue-500 font-semibold mb-6">Security Supervisor</p>

      <div class="grid grid-cols-2 gap-4 mb-6 border-t border-b border-gray-100 py-4">
        <div>
          <div class="text-sm text-gray-400">Total Check-ins</div>
          <div class="text-2xl font-bold text-gray-800">128</div>
        </div>
        <div>
          <div class="text-sm text-gray-400">Total Check-outs</div>
          <div class="text-2xl font-bold text-gray-800">115</div>
        </div>
      </div>

      <ion-list class="bg-transparent text-left" lines="none">
        <ion-item class="bg-slate-50 rounded-xl mb-3 shadow-none border border-gray-100">
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Edit Profile</ion-label>
          <ion-icon name="chevron-forward-outline" slot="end" class="text-gray-400"></ion-icon>
        </ion-item>
        <ion-item class="bg-slate-50 rounded-xl mb-3 shadow-none border border-gray-100">
          <ion-icon name="settings-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Settings</ion-label>
          <ion-icon name="chevron-forward-outline" slot="end" class="text-gray-400"></ion-icon>
        </ion-item>
        <ion-item class="bg-red-50 rounded-xl shadow-none border border-red-100 mt-6" detail="false" button>
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger" class="font-bold">Log Out</ion-label>
        </ion-item>
      </ion-list>
    </div>
  </div>
</ion-content>
